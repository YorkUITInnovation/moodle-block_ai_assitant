[project]
name = "lti-ai-assistant"
version = "0.1.0"
description = "Standalone LTI 1.3 scaffold for AI Assistant (extracted from Moodle plugin)."
authors = [ { name = "Your Team" } ]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["LTI", "IMS", "FastAPI", "Education", "Canvas", "Brightspace"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "cachetools>=5.3.3",
  "jinja2>=3.1.4",
  "cryptography>=42.0.0",
  "sqlalchemy>=2.0.30",
  "pymysql>=1.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "anyio>=4.4.0",
  "requests>=2.32.0",
  "alembic>=1.13.1"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-q"

[tool.setuptools]
packages = ["app"]
